[package]
name = "tessel-editor-media"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Media adapters: FFmpeg/FFprobe, import, derived media, packages and video export (no GPUI)"

[dependencies]
tessel-editor-core = { path = "../core" }
serde_json.workspace = true
sha2 = "0.10"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
# File identity (volume + file index) for the claims ledger lock, where `unsafe` is forbidden and
# std keeps `file_index` unstable (BL167.6). Already in the lockfile through `walkdir`.
same-file = "1"

[lints]
workspace = true

[[bin]]
name = "tessel-media"
path = "src/bin/tessel-media.rs"
