[package]
name = "tessel-editor-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
# SPZ is gzip: the probe inflates its 16-byte header to tell it from a random gzip.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Tests only: the transition-gate boundary scan (`tests/scene_fx_transition/scan.rs`) needs the
# real Rust lexer (raw strings, `'{'` against lifetimes, nested comments, delimiters), which a
# line/brace counter cannot give. Already in the lock (a build-time dependency of other crates);
# no parser, no features, never reaches the library.
proc-macro2 = { version = "1", default-features = false }

[lints]
workspace = true
