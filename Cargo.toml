[workspace]
members = ["crates/audio", "crates/core", "crates/desktop", "crates/media", "crates/render"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/journey-studios/tessel-editor"

[workspace.dependencies]
gpui-kit = "=0.9.0"

async-channel = "2.5"
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
